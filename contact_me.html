<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Contact | Nestashots Photography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&amp;display=swap"
      rel="stylesheet"
    />

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/contact_me.css" />
  </head>

  <body>
    <nav>
        <div class="logo">
            <a href="index.html"><img src="../img/logo.png" alt="Nestashots"></a>
        </div>
    </nav>
    <section class="contact-page">
      <div class="contact-header">
        <h1>Let's Create Something Beautiful</h1>

        <p>
          Whether you're planning a wedding, graduation, birthday or any special occasion, I'd love to hear all about
          it.
        </p>
      </div>

      <form class="contact-form">
        <h2>Your Details</h2>

        <div class="form-grid">
          <input type="text" placeholder="Full Name" required="" />

          <input type="email" placeholder="Email Address" required="" />

          <input type="tel" placeholder="Phone Number" />
        </div>

        <hr />

        <h2>Event Details</h2>

        <div class="form-grid">
          <select required="">
            <option selected="" disabled="">Select Service</option>

            <option>Wedding</option>

            <option>Graduation</option>

            <option>Birthday</option>

            <option>Matric Dance</option>

            <option>Maternity Shoot</option>

            <option>Engagement Shoot</option>

            <option>Corporate Event</option>

            <option>Family Portrait</option>

            <option>Other</option>
          </select>

          <input type="date" />

          <input type="text" placeholder="Venue / Location" />

          <input type="number" placeholder="Estimated Guests" />
        </div>

        <hr />

        <h2>Your Vision</h2>

        <textarea
          rows="8"
          placeholder="Tell me about your event, ideas, inspiration, preferred style, colours, or anything you'd like me to know..."
        ></textarea>

        <div class="checkbox">
          <label>
            <input type="checkbox" />

            I'd like to receive a quotation.
          </label>
        </div>

        <button type="submit">Send Enquiry</button>
      </form>
    </section>
  </body>
</html>
